name: Cross-platform build preview
on:
  workflow_dispatch:
    inputs:
      installed-updater:
        description: Run isolated real cross-version installer validation
        type: boolean
        default: false
      updater-platform:
        description: Isolated updater platform (all, windows-x64, linux-x64, macos-arm64, macos-x64, android)
        type: string
        default: all
permissions:
  contents: read
jobs:
  desktop:
    if: ${{ !inputs.installed-updater && github.ref != 'refs/heads/feat/auto-update-mirrors' }}
    uses: ./.github/workflows/desktop-build.yaml
  android:
    if: ${{ !inputs.installed-updater && github.ref != 'refs/heads/feat/auto-update-mirrors' }}
    uses: ./.github/workflows/android-build.yaml
  installed-updater:
    if: ${{ inputs.installed-updater || github.ref == 'refs/heads/feat/auto-update-mirrors' }}
    uses: ./.github/workflows/updater-validation.yaml
    with:
      platform: ${{ inputs.updater-platform || 'all' }}
    secrets: inherit
