name: Android artifacts
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEY_BASE64:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
  workflow_dispatch:
    inputs:
      release:
        description: Build and verify signed release artifacts (main only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    if: ${{ !inputs.release || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_MODE: ${{ inputs.release && 'release' || 'debug' }}
      VITE_TIANDITU_KEY: ${{ vars.TIANDITU_WEB_KEY }}
      CARGO_TERM_COLOR: always
      CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
      CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain (cloud only)
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android-ndk28
          cache-on-failure: true
      - name: Initialize Android project and apply tracked overlays
        run: |
          bun install --frozen-lockfile
          bun run check:versions
          bun run tauri android init --ci
          bun scripts/prepare-android.ts
      - name: Configure stable release signing
        if: inputs.release
        run: bun scripts/configure-android-signing.ts
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Build Android artifacts
        run: |
          if [ "$BUILD_MODE" = 'release' ]; then
            bun run tauri android build --ci --apk --aab --target aarch64 x86_64
          else
            bun run tauri android build --debug --ci --apk --target aarch64 x86_64
          fi
      - name: Verify release signature and modern Android alignment
        if: inputs.release
        run: python3 scripts/verify-android.py
      - name: Collect Android artifacts
        run: bun scripts/collect-mobile-artifacts.ts "$BUILD_MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ env.BUILD_MODE }}
          path: artifacts/android-${{ env.BUILD_MODE }}/*
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM for cloud emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, cold start, and reinstall on modern Android
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/android-smoke.sh
      - name: Upload Android runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-runtime-${{ env.BUILD_MODE }}
          path: artifacts/android-diagnostics/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean signing material
        if: always()
        run: |
          rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/yakumo-release.p12"
