name: Desktop release artifacts
on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VITE_TIANDITU_KEY: ${{ vars.TIANDITU_WEB_KEY }}
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup desktop
        uses: ./.github/actions/setup-desktop
        with:
          target: ${{ matrix.target }}
      - name: Configure ad-hoc signing for macOS
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Check application versions
        run: bun run check:versions
      - name: Build platform bundles
        run: bun run tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Collect bundles and checksums
        run: bun scripts/collect-artifacts.ts '${{ matrix.name }}'
      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/*
          if-no-files-found: error
          retention-days: 7
