name: Verify and recover updater channel
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semifold-main
  cancel-in-progress: false
jobs:
  verify-and-promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      YAKUMO_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-desktop
      - name: Download current version's already published artifacts (read only)
        run: |
          tag=$(bun scripts/release-plan.ts | bun -e 'console.log((await Bun.stdin.json()).tag)')
          gh release download "$tag" --dir artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate and verify manifest against published signatures
        run: |
          bun scripts/generate-update-manifest.ts artifacts
          cargo run --locked --bin verify-update -- artifacts
      - name: Verify remote bytes and atomically advance channel
        run: bun scripts/promote-update-channel.ts artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
