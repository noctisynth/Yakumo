name: Quality
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format and lint
        run: bun run check
      - name: Release metadata and script types
        run: |
          bun run check:versions
          bun run typecheck:scripts
          bun run test:release
          bun run test:accounts
          bun run test:dashboard
      - name: Frontend production build
        run: bun run build
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@9dc3b2e2f25d5db332322b29c3d3436c857ca1d9
        with:
          version: '0.3.4'
      - name: Semifold workspace and plan
        run: |
          semifold config sync --check
          # Semifold 0.3.4 treats every GITHUB_ACTIONS event as a pull request.
          # This job only needs the local plan; PR comments use their own workflow.
          env -u GITHUB_ACTIONS semifold status

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup desktop
        uses: ./.github/actions/setup-desktop
      - name: Check versions
        run: bun run check:versions
      - name: Format, Clippy, and Rust tests
        run: |
          bun run check:rust
          bun run test:rust
      - name: Build desktop application
        run: bun run tauri build --debug --no-bundle
