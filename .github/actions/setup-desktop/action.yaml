name: Setup desktop toolchain
description: Install pinned frontend tools, stable Rust, and native Tauri build dependencies
inputs:
  target:
    description: Optional Rust compilation target
    required: false
    default: ''
  cache-on-failure:
    description: Keep dependency build cache when isolated validation fails
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
          libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22.22.3'
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: '1.4.2'
    - name: Setup stable Rust
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        components: rustfmt, clippy
        targets: ${{ inputs.target }}
    - name: Cache Rust
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        key: ${{ inputs.target }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
    - name: Install frontend dependencies
      shell: bash
      run: bun install --frozen-lockfile
